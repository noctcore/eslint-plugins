<text class="d-code-key" x="44" y="85">TaskCard.tsx</text>
<text class="d-note" x="32" y="116">entry file, checked</text>
<path class="d-wire" d="M182 80 H212 M212 69 V213 M212 69 H236 M212 105 H236 M212 141 H236 M212 177 H236 M212 213 H236"/>
<rect class="d-chip" x="236" y="56" width="184" height="26" rx="4"/>
<text class="d-code" x="248" y="73">TaskCard.hooks.ts</text>
<rect class="d-chip" x="236" y="92" width="184" height="26" rx="4"/>
<text class="d-code" x="248" y="109">TaskCard.types.ts</text>
<rect class="d-chip" x="236" y="128" width="184" height="26" rx="4"/>
<text class="d-code" x="248" y="145">TaskCard.stories.tsx</text>
<rect class="d-chip-bad" x="236" y="164" width="184" height="26" rx="4"/>
<text class="d-code-bad" x="248" y="181">TaskCard.test.tsx</text>
<rect class="d-chip" x="236" y="200" width="184" height="26" rx="4"/>
<text class="d-code" x="248" y="217">index.ts</text>
<text class="d-bad-text" x="32" y="196">missing on disk</text>
<text class="d-note" x="32" y="214">reported on TaskCard.tsx</text>
<text class="d-code-key" x="456" y="26">requireOwnFolder</text>
<rect class="d-panel" x="456" y="40" width="208" height="196" rx="6"/>
<text class="d-code" x="472" y="66">splash/</text>
<rect class="d-chip-bad" x="472" y="78" width="130" height="28" rx="4"/>
<text class="d-code-bad" x="484" y="97">SplashRain.tsx</text>
<text class="d-bad-text" x="472" y="128">not in its own folder</text>
<path class="d-flow" d="M537 138 V160"/>
<path class="d-ink-head" d="M537 167 l-4 -7 h8 z"/>
<text class="d-code" x="472" y="188">SplashRain/</text>
<rect class="d-chip-ok" x="488" y="196" width="130" height="26" rx="4"/>
<text class="d-code-ok" x="500" y="213">SplashRain.tsx</text>
</svg>
