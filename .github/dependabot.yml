# Keeps pinned GitHub Actions SHAs (and their `# vX.Y.Z` comments, which
# @noctcore/lint-meta-rules' github-actions-sha-pinned expects) and the Bun
# lockfile current. A 7-day cooldown means a freshly published release, the
# usual window for a compromised version, is never proposed the day it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Dependabot puts a dependency in the first group that matches it, so this
    # one has to come first. The typescript-eslint packages share types and
    # must always move in lockstep: bumping only rule-tester (a production
    # dependency of eslint-test-utils) while utils/parser stay behind breaks
    # typecheck with mismatched RuleContext types.
    groups:
      typescript-eslint:
        patterns: ['@typescript-eslint/*', 'typescript-eslint']
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    commit-message:
      prefix: chore
      include: scope
