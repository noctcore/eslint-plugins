# Keeps pinned GitHub Actions SHAs (and their `# vX.Y.Z` comments, which
# @noctcore/lint-meta-rules' github-actions-sha-pinned expects) and the Bun
# lockfile current. A 7-day cooldown means a freshly published release, the
# usual window for a compromised version, is never proposed the day it lands.
#
# Groups only batch minor and patch updates. A major version (a new
# changesets/action, TypeScript, vitest...) arrives as its own pull request,
# because each one usually needs its own migration and must be judged alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Dependabot puts a dependency in the first group that matches it, so this
    # one has to come first. The typescript-eslint packages share types and
    # must always move in lockstep: bumping only rule-tester (a production
    # dependency of eslint-test-utils) while utils/parser stay behind breaks
    # typecheck with mismatched RuleContext types.
    groups:
      typescript-eslint:
        patterns: ['@typescript-eslint/*', 'typescript-eslint']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @types/node follows the oldest Node we support (engines: >=22), not the
      # newest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
