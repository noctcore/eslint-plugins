name: changeset

# A pull request that changes a published package must carry a changeset, or it
# merges green and the fix never ships: the release workflow only versions what
# a changeset names. `changeset status --since` fails when a package changed
# since the base branch and no changeset covers it.
#
# A change that should not release anything (tests or docs inside a package)
# opts out explicitly with an empty changeset: `bun run changeset --empty`.
#
# Skipped for the Version Packages PR (it consumes changesets) and for
# Dependabot, whose dependency bumps are released with the next real change.
on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    name: changeset status
    if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # changesets compares against the base branch, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
