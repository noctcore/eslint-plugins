name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: build · typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Build first: plugins resolve @noctcore/eslint-utils via its emitted
      # dist/*.d.ts, so typecheck needs the build to have run.
      - run: bun run build
      - run: bun run typecheck

  # One job per ESLint major, in parallel with typecheck: the two test passes
  # used to run back to back and made up most of the job. The public repo's
  # runners are free, so building once per job costs no Actions minutes.
  test:
    name: test · eslint ${{ matrix.eslint }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eslint: [10, 9]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Tests read built dist/ too: plugins import @noctcore/eslint-utils, and
      # lint-meta-rules runs against the workspace plugins' builds.
      - run: bun run build
      - run: bun run test:eslint${{ matrix.eslint }}
