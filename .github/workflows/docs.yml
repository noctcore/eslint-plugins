name: docs

# Builds the docs site (site/) and deploys it to GitHub Pages at
# https://noctcore.github.io/eslint-plugins/.
#
# Pull requests build and check the site without deploying, so a rule added
# without a doc, or a doc that no longer renders, fails before merge.
#
# Every action is pinned to a full commit SHA with its version beside it, as
# @noctcore/lint-meta-rules' github-actions-sha-pinned asks of everyone else.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time; never cancel one halfway through.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Astro 7 needs Node 22.12 or newer; the runner image ships an older one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # The site reads each plugin's built dist for its rule tables and link check.
      - run: bun run build
      # sync -> astro build -> scripts/check-build.ts (routes, base, docs URLs).
      - run: bun run docs:build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy to Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
