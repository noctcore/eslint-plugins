name: release

# Changesets two-phase release:
#   - PRs land with a changeset (`bun run changeset`) describing which packages bump.
#   - On push to main, if changesets are pending, the Changesets bot opens/updates a
#     "Version Packages" PR (bumps versions + writes CHANGELOGs).
#   - Merging that PR (no pending changesets) publishes the changed packages to npm.
# On the very first run there are no changesets, so it publishes the initial 0.1.0
# versions directly. Publishing goes through `npm publish` (via `changeset publish`)
# through npm trusted publishing (OIDC: `id-token: write`, npm 11.5.1+, and a trusted
# publisher per package on npmjs.com), with provenance from publishConfig.provenance.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Nothing at the top level: each job asks for exactly what it uses.
permissions: {}

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the version commit and release tags
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept on purpose: changesets/action pushes the version branch and tags.
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Node 24 ships npm 11. npm trusted publishing (OIDC) needs npm 11.5.1 or
      # later; Node 22's bundled npm 10 silently falls back to NPM_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Require npm with trusted publishing support
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs'); process.exit(1) }" "$(npm --version)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Create Version PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version-packages
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only: npm tries OIDC trusted publishing first. Remove once a
          # release log shows OIDC succeeding, then set every package to
          # "Require 2FA and disallow tokens" on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
